  function validateDesign(value) {
  if (value == null) return { texts: {}, images: {} };
  if (
    typeof value !== "object" ||
    Array.isArray(value) ||
    !value.texts ||
    !value.images
  )
    throw Error("Görsel taslak geçersiz.");
  const result = { texts: {}, images: {} };
  for (const lang of ["tr", "en", "ru"]) {
    const entries = value.texts[lang] || {};
    result.texts[lang] = {};
    for (const [key, text] of Object.entries(entries)) {
      if (
        !/^(ui:[a-zA-Z][a-zA-Z0-9]*|slot:[a-z.]+)$/.test(key) ||
        typeof text !== "string" ||
        text.length > 12000
      )
        throw Error("Görsel taslak metni geçersiz.");
      result.texts[lang][key] = text;
    }
  }
  for (const [key, url] of Object.entries(value.images)) {
    if (
      !/^(home\.[a-z.]+|brand:[a-z0-9_-]+)$/.test(key) ||
      typeof url !== "string" ||
      url.length > 2000000 ||
      !/^data:image\/webp;base64,[a-zA-Z0-9+/=]+$/.test(url)
    )
      throw Error("Görsel taslak fotoğrafı geçersiz.");
    result.images[key] = url;
  }
  return result;
}

  const allowedTables = new Set([
  "products",
  "variants",
  "models",
  "generations",
  "model_years",
  "compatibility",
  "product_images",
  "categories",
  "content",
]);
const forbidden = new Set(["__proto__", "constructor", "prototype", "id"]);
function mergeFields(record, changes) {
  for (const [key, value] of Object.entries(changes)) {
    if (forbidden.has(key)) throw new Error("Invalid catalog update field");
    if (value && typeof value === "object" && !Array.isArray(value)) {
      const previous = record[key];
      record[key] =
        previous && typeof previous === "object" && !Array.isArray(previous)
          ? { ...previous }
          : {};
      mergeFields(record[key], value);
    } else record[key] = value;
  }
}
/**
 * Apply requested public catalog edits once without resetting other drafts.
 * @template T
 * @param {T} catalog
 * @param {{id:string,table:string,recordId:string,changes:Record<string,unknown>}[]} updates
 * @param {string[]} [previousIds]
 */
function applyCatalogUpdates(catalog, updates, previousIds = []) {
  const next = structuredClone(catalog),
    applied = new Set(previousIds);
  let changed = false;
  for (const update of updates) {
    if (
      !update ||
      typeof update.id !== "string" ||
      !allowedTables.has(update.table) ||
      typeof update.recordId !== "string" ||
      !update.changes ||
      typeof update.changes !== "object"
    )
      throw new Error("Invalid catalog update");
    if (applied.has(update.id)) continue;
    const row = next[update.table]?.find((r) => r.id === update.recordId);
    if (row) {
      mergeFields(row, update.changes);
      changed = true;
    }
    applied.add(update.id);
  }
  return { catalog: next, appliedIds: [...applied], changed };
}

  let catalog = INITIAL,
    design = { texts: {}, images: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && Array.isArray(saved.products) && Array.isArray(saved.models))
      catalog = saved;
    const applied = JSON.parse(
      localStorage.getItem(KEY + ".catalog-updates") || "[]",
    );
    catalog = applyCatalogUpdates(catalog, PREVIEW.updates, applied).catalog;
    design = validateDesign(
      JSON.parse(localStorage.getItem(KEY + ".design") || "null"),
    );
  } catch {
    /* A clean browser starts with the clearly labelled demo catalog. */
  }
  const path = location.hash.startsWith("#/") ? location.hash.slice(1) : "/";
  const lang = new URL(path, "https://kuzmin.preview").searchParams.get("lang");
  window.__KZ_SITE__ = {
    catalog,
    design,
    path,
    lang: lang === "en" || lang === "ru" ? lang : "tr",
    assets: PREVIEW.assets,
    inspect: false,
    cart: [],
    standalone: true,
    storageKey: KEY,
  };
  const code = new TextDecoder().decode(
    Uint8Array.from(atob(PREVIEW.js), (c) => c.charCodeAt(0)),
  );
  const script = document.createElement("scr" + "ipt");
  script.src = URL.createObjectURL(
    new Blob([code], { type: "text/javascript" }),
  );
  script.onerror = () => {
    document.getElementById("root").textContent =
      "Önizleme açılamadı. Sayfayı yenileyin.";
  };
  document.body.appendChild(script);
})();
